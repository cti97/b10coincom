name: ci
on:
  push:
  pull_request:
  # The audit's B-1 also asked that govulncheck see the LIVE vulnerability
  # database periodically, not only on pushes: a newly published advisory
  # about a pinned dependency should fail the gate in days, not when someone
  # next pushes. A twice-a-week schedule (and the lint job below runs ALL its
  # checks on it - cheap) re-checks this tree against vuln.go.dev on every
  # pass, without anyone touching the repository.
  schedule:
    - cron: '23 5 * * 2,5'

# The workflow's token can do nothing but read: neither vet, test, release nor
# lint needs write access to the repository. Scoping the token is the audit's
# B-1 ask alongside SHA pins: a compromised workflow cannot do more than its
# own steps allow with the identity those steps run under. The release job
# publishes dist/ through actions/upload-artifact (audit B-2), which writes
# with the workflow's own runtime token and needs no extra permission.
permissions:
  contents: read

# Bash everywhere: the linux/darwin cross entries and the windows entries run
# the SAME `GOOS=... GOARCH=...` env-prefixed lines, and windows-latest
# provides bash. One command text for all six targets, no per-OS forks.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Both actions are SHA-pinned, not tag-pinned (the audit's B-1): a tag
      # is mutable — `uses: actions/checkout@v4` runs whatever that tag points
      # at when the job starts, carrying this workflow's token. A commit SHA
      # never moves; Dependabot's github-actions ecosystem opens the update
      # PRs from one pin to the next after each upstream release. The tag
      # each SHA matches is named in the comment beside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The version comes from go.mod (its `go` floor and `toolchain`
          # minimum), so the CI Go version and the module's demand cannot
          # drift apart (the audit's B-1: '1.23' was end-of-life).
          go-version-file: go.mod
      # -count=1 forces real test execution: without it cached results make a
      # flaky test report green from a previous run. -timeout is the audit's
      # T-3 ask: internal/devnet's poll loops carry wall-clock ceilings, so a
      # slow-but-progressing run can outlive go test's default 10-minute
      # package timeout and die with a goroutine dump — a failure that says
      # nothing about the code. `-timeout` applies to EACH package's test
      # binary, so the number the timeout must clear is the worst single
      # package's ceilings, not the suite's.
      #
      # Re-measured 2026-10-30 (audit L-3): the devnet package's ceilings —
      # every deadline its wait helpers are given (waitAllReach, waitFor,
      # reachError, convergedError) plus its bounded polls — now total about
      # 3,030 s (~50 min); counting the sub-second polls as well, about
      # 3,900 s (~65 min). The earlier "~1770 s (all second-literals, ~2340 s)"
      # was already an undercount, and 40 m (2,400 s) no longer clears the
      # package's own ceilings. 60 m does, for both the plain and the -race
      # binary (same ceilings, slower execution), and it is still far above the
      # measured healthy pass: internal/devnet takes 104 s alone, 177 s in the
      # full suite and 201 s under -race on the audit host, and that healthy
      # pass is the only run that should ever finish. A timeout this large is a
      # bound on a pathological run, never an expectation.
      - run: go vet ./...
      - run: go test -timeout 60m -count=1 ./...
      - run: go test -race -timeout 60m -count=1 ./...
      - run: go build ./...
      # The milestone acceptance commands must keep printing OK with exit 0.
      # The first is the default run — its --claims default makes it pay one
      # claim and prove the same-epoch double claim refused — and the second
      # runs the claim variant explicitly so the faucet path cannot degrade
      # with the flag's default unnoticed. The third is M3's: four validators
      # must AGREE, not merely each produce blocks — the multi-validator
      # devnet reports each validator's final height and fails the job unless
      # the validators hold one history. The fourth is M5's rotation: one seat
      # unbonds mid-epoch, six seats become five at the boundary, and the
      # Nakamoto coefficient is computed from committed state at each one. It
      # was missing here while the README claimed four (M5 re-run, 2026-10-30).
      # It adds about 8 s (measured: 105 blocks, six in-process validators, two
      # rotation boundaries) to a job already running the suite and the race
      # suite, so keeping the milestone check is far cheaper than deleting it
      # from the README to make the count true.
      - run: go run ./cmd/b10coin devnet --blocks 100
      - run: go run ./cmd/b10coin devnet --blocks 100 --claims 1
      - run: go run ./cmd/b10coin devnet --validators 4 --blocks 100
      - run: go run ./cmd/b10coin devnet --validators 6 --epoch-blocks 40 --blocks 105 --rotate-demo --plot-nakamoto

  # The supply-chain/lint gate (the audit's B-1): formatting, module hygiene,
  # staticcheck and govulncheck. The two external tools are pinned by exact
  # version and run through `go run tool@version`, which keeps them OUT of
  # go.mod (they are developer tooling, not dependencies of this code) while
  # making the gate reproducible: the finding set is a function of the
  # checked-in version, not of whatever ships that week.
  lint:
    runs-on: ubuntu-latest
    # contents: read is inherited from the top-level default; the ONLY extra grant
    # is issues: write, for the scheduled toolchain-chore step below. No other job
    # gains anything.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # gofmt is enforced on the module's OWN source trees (`cmd`, `internal`),
      # the only directories holding checked-in Go. The README claims the tree
      # is gofmt-clean; this makes the claim a gate.
      - name: gofmt -l reports nothing
        run: |
          unformatted=$(gofmt -l cmd internal)
          test -z "$unformatted" || { echo "not gofmt-clean:"; echo "$unformatted"; exit 1; }
      # shellcheck over every shell script in the tree (audit N-16): the deploy
      # harness, the release/build scripts and the plan guard are operator-facing
      # code that no Go test runs. The gate is `--severity=warning` so it fails
      # on real defects (warnings and errors) without turning pre-existing
      # info/style notes into a red CI; acceptance.sh and check-plan.sh are
      # clean at the default severity too. shellcheck ships on GitHub's
      # ubuntu-latest runner, but a MISSING shellcheck must never look like a
      # clean lint: this step fails loudly rather than passing silently.
      - name: shellcheck the scripts
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::error::shellcheck is not installed; install it (apt-get install shellcheck). This gate must not pass silently."
            exit 1
          fi
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning
      # `go mod tidy` must be a no-op on a committed tree: a graph tidy wants
      # to change means go.mod/go.sum lie about the build. The diff pins both.
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      # staticcheck 2026.2.1 (module honnef.co/go/tools v0.8.1), the release
      # that matches the toolchain go.mod demands. Findings fail the job: the
      # tree today is clean, so a new finding must be fixed or — with a
      # written reason — excluded, never ignored silently.
      # GOTOOLCHAIN is pinned here on purpose, and NOT to the module's toolchain.
      # Go 1.27.2 raised the compiler's export-data version to 5; staticcheck
      # 2026.2.1 / v0.8.1 is the newest release that exists and its golang.org/x/tools
      # reads up to version 4, so under 1.27.2 it fails with
      #   internal error in importing "internal/byteorder" (... version 5 is greater
      #   than maximum supported version 4)
      # which is an upstream limitation, not a finding about this code. The 2026-10-08
      # net/http advisories are fixed in BOTH 1.26.9 and 1.27.2, so linting under
      # 1.26.9 keeps the vulnerability gate and the lint gate simultaneously. It also
      # matches the module's `go 1.26.0` language floor, which is what staticcheck
      # should judge the source against. Revisit when a staticcheck release reads v5.
      - run: GOTOOLCHAIN=go1.26.9 go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      # govulncheck v1.8.0 (golang.org/x/vuln/cmd/govulncheck) checks
      # call-reachable vulnerabilities against the live vuln DB at
      # https://vuln.go.dev — module-level advisories the code never calls do
      # not fail the gate, which is exactly the signal worth gating on.
      - name: govulncheck
        run: |
          set -o pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... 2>&1 | tee "$RUNNER_TEMP/govulncheck.out"
      # The pinned `toolchain` line (audit B-1) means every Go patch release that
      # fixes a standard-library advisory turns into a red `schedule` run while the
      # code stands still. That is the gate working - but it is a chore nobody sees
      # until they look at Actions, and it has now rotated twice (2026-10-08 ->
      # go1.27.2, then GO-2026-6809 -> go1.27.3). This step files the issue so the
      # chore becomes visible where work is tracked, instead of relying on someone
      # noticing a red cron run.
      #
      # It only ever files on the SCHEDULE trigger: a push or PR that fails
      # govulncheck is a normal failure its author sees immediately, and opening an
      # issue for it would be noise. It is `failure()`-gated and classifies THIS
      # job's failure: govulncheck's output on disk with advisory IDs -> the
      # toolchain-bump or triage issue; anything else (gofmt, shellcheck, tidy,
      # staticcheck, or govulncheck missing) -> a generic `lint` issue. A red cron
      # must never be silent (audit CI-1).
      # The reporter lives in scripts/ci/ so that the shellcheck gate above covers it -
      # ~90 lines of inline YAML shell was logic the rest of this workflow does not have
      # and nothing linted. See that script's header for what it files and why.
      - name: file an issue when a scheduled lint fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/file-toolchain-issue.sh "$RUNNER_TEMP/govulncheck.out"
  # The portability matrix: every supported target is COMPILED and, crucially,
  # go-VETTED for that GOOS/GOARCH. Vet, not build, is what caught the real
  # cross-platform defect of this milestone — a Unix-only syscall in the
  # relay's TEST code that made `GOOS=windows go vet` fail while every build
  # stayed green — so a build-only matrix would have shipped the hole. Each
  # target cross-compiles from one runner; the pair (GOOS, GOARCH) is what
  # the code must survive, not the runner it is compiled on.
  cross:
    runs-on: ${{ matrix.os }}
    name: build + vet (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64 }
          - { os: ubuntu-latest,  goos: linux,   goarch: arm64 }
          - { os: macos-latest,   goos: darwin,  goarch: amd64 }
          - { os: macos-latest,   goos: darwin,  goarch: arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
          - { os: windows-latest, goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  # The release: both binaries for all six targets in dist/ with SHA256SUMS.
  # scripts/build-release.sh owns the build flags AND the artifact assertions
  # (count == target count, every artifact file(1)-checked to report its own
  # architecture, a failing target leaves no partial dist/), so this job
  # simply runs the one build story — replacing the single linux/arm64 job
  # this workflow carried since the Pi task. A regression that silently
  # produced only the host platform's binaries, or dropped one of the pair,
  # fails HERE and not on a Pi flashed hours later. The job then UPLOADS the
  # whole dist/ (audit B-2: it verified and threw the bytes away): a run's
  # artifacts are retrievable instead of rebuilt, and BUILD-INFO names the
  # toolchain and the reproducible flags that produced them.
  #
  # SIGNING BOUNDARY: SHA256SUMS is signed only if B10COIN_RELEASE_SIGN_KEY
  # points at a minisign secret key. Add a repository secret holding the key
  # file's bytes, write it to a runner temp file in a step here, and export the
  # path; nothing signs without it and no key belongs in this repository.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make release
      - run: file dist/*
      # Belt over the script's internal assertion: exactly 12 b10coin-*
      # artifacts for 6 targets (BUILD-INFO is metadata, not a binary), and
      # every artifact line present in SHA256SUMS.
      - run: test "$(ls dist/b10coin-* | wc -l)" -eq 12
      - run: test "$(wc -l < dist/SHA256SUMS)" -eq 12
      # The toolchain record must exist and be non-empty (audit B-2).
      - run: grep -q '^toolchain go' dist/BUILD-INFO
      - run: grep -q '^flags -trimpath -buildvcs=false$' dist/BUILD-INFO
      # Publish the artifacts (audit B-2). Pinned by commit SHA, like every
      # other action here; the comment names the tag it matches.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: b10coin-release
          path: dist/
          if-no-files-found: error

  # CI-1's durable fix, not just its instance: a scheduled run that fails ANY
  # job is reported, not only one that fails govulncheck. `main` failed its
  # scheduled release on every run from 2026-10-27 and nobody was told, because
  # the only reporter lived in `lint` and watched one step.
  #
  # This job exists instead of appending a reporter step to each job for two
  # reasons. First, the token scope: only `lint` had `issues: write`, and that
  # stays true - `test`, `release` and `cross` remain read-only. Second, `lint`
  # reports itself in-job, where govulncheck's output file still exists; a
  # separate job cannot read another job's $RUNNER_TEMP, so the toolchain-bump
  # body (with "Fixed in:" and the four verify commands) would be lost. The two
  # paths never overlap: `lint` is not in the loop below.
  #
  # `always()` so a failure upstream still reaches it; the event gate keeps it
  # off pushes and PRs, where the author already sees the failure. The script
  # dedups by exact title and exits 0 on every path, including a failed gh call.
  report:
    if: always() && github.event_name == 'schedule'
    needs: [test, lint, release, cross]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: file an issue for every failed scheduled job
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          CROSS_RESULT: ${{ needs.cross.result }}
        run: |
          set -u
          # `lint` reports itself in-job (its govulncheck output is there); the
          # other jobs have no vuln output to classify, so each gets a generic
          # "scheduled <job> job failed" issue. Matrix legs of `cross` share one
          # title on purpose: one broken platform should not open six issues,
          # and later legs comment on the first one.
          for job in test release cross; do
            case "$job" in
              test)    result=$TEST_RESULT ;;
              release) result=$RELEASE_RESULT ;;
              cross)   result=$CROSS_RESULT ;;
            esac
            if [ "$result" = failure ]; then
              REPORT_JOB=$job ./scripts/ci/file-toolchain-issue.sh \
                || echo "::warning::the scheduled-failure reporter failed for the $job job"
            fi
          done