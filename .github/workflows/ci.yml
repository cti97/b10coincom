name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      # -count=1 forces real test execution: without it cached results make a
      # flaky test report green from a previous run.
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      # M4's Pi deliverable, CI-checked so the ARM64 cross-compile cannot rot
      # silently on one developer's machine. (Task 9 replaces this single
      # linux/arm64 build with the six-target release matrix.)
      - run: make arm64
      # Assert the ARTIFACTS, not the command's exit code: exactly two ARM64
      # binaries, and EACH really is a static linux/aarch64 ELF. The arch
      # check loops per file — the same loop scripts/deploy/build.sh runs —
      # because one grep over the whole listing accepts a MIXED pair (a host
      # Mach-O beside one ARM ELF) and would let a cross-compile that built
      # only one of the two binaries pass. A build that silently produced
      # host binaries or dropped one of the two binaries must fail here,
      # not on a Pi that was flashed hours earlier.
      - run: test "$(ls bin/*-linux-arm64 | wc -l)" -eq 2
      - run: file bin/*-linux-arm64
      - run: |
          for f in bin/*-linux-arm64; do
            if ! file "$f" | grep -q 'ELF 64-bit LSB.*ARM aarch64'; then
              echo "FAIL: $f is not a 64-bit ARM aarch64 ELF:" >&2
              file "$f" >&2
              exit 1
            fi
          done
      # The milestone acceptance commands must keep printing OK with exit 0.
      # The first is the default run — its --claims default makes it pay one
      # claim and prove the same-epoch double claim refused — and the second
      # runs the claim variant explicitly so the faucet path cannot degrade
      # with the flag's default unnoticed. The third is M3's: four validators
      # must AGREE, not merely each produce blocks — the multi-validator
      # devnet reports each validator's final height and fails the job unless
      # the validators hold one history.
      - run: go run ./cmd/b10coin devnet --blocks 100
      - run: go run ./cmd/b10coin devnet --blocks 100 --claims 1
      - run: go run ./cmd/b10coin devnet --validators 4 --blocks 100
