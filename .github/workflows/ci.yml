name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      # -count=1 forces real test execution: without it cached results make a
      # flaky test report green from a previous run.
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      # The milestone acceptance command must keep printing OK with exit 0.
      - run: go run ./cmd/b10coin devnet --blocks 100
