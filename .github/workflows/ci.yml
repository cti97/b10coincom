name: ci
on:
  push:
  pull_request:
  # The audit's B-1 also asked that govulncheck see the LIVE vulnerability
  # database periodically, not only on pushes: a newly published advisory
  # about a pinned dependency should fail the gate in days, not when someone
  # next pushes. A twice-a-week schedule (and the lint job below runs ALL its
  # checks on it - cheap) re-checks this tree against vuln.go.dev on every
  # pass, without anyone touching the repository.
  schedule:
    - cron: '23 5 * * 2,5'
  # Audit F-2: the scheduled-failure REPORTER (`report` below) has never run
  # except as skipped, and CI-1's fix merged after the last scheduled run, so
  # there was no way to exercise it without waiting for a cron Tuesday. This
  # manual trigger can run the whole workflow, and `simulate_failure` fails the
  # `test` job on purpose so the reporter's issue-filing path runs end to end:
  #
  #     gh workflow run ci.yml -f simulate_failure=true
  #
  # It files one test issue (delete it afterwards). Without the input it is an
  # ordinary on-demand run of every job.
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "FAIL the test job on purpose so the scheduled-failure reporter can be exercised; a test issue is filed (audit F-2)"
        type: boolean
        default: false

# The workflow's token can do nothing but read: neither vet, test, release nor
# lint needs write access to the repository. Scoping the token is the audit's
# B-1 ask alongside SHA pins: a compromised workflow cannot do more than its
# own steps allow with the identity those steps run under. The release job
# publishes dist/ through actions/upload-artifact (audit B-2), which writes
# with the workflow's own runtime token and needs no extra permission.
permissions:
  contents: read

# Bash everywhere: the linux/darwin cross entries and the windows entries run
# the SAME `GOOS=... GOARCH=...` env-prefixed lines, and windows-latest
# provides bash. One command text for all six targets, no per-OS forks.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Both actions are SHA-pinned, not tag-pinned (the audit's B-1): a tag
      # is mutable — `uses: actions/checkout@v4` runs whatever that tag points
      # at when the job starts, carrying this workflow's token. A commit SHA
      # never moves; Dependabot's github-actions ecosystem opens the update
      # PRs from one pin to the next after each upstream release. The tag
      # each SHA matches is named in the comment beside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The version comes from go.mod (its `go` floor and `toolchain`
          # minimum), so the CI Go version and the module's demand cannot
          # drift apart (the audit's B-1: '1.23' was end-of-life).
          go-version-file: go.mod
      # -count=1 forces real test execution: without it cached results make a
      # flaky test report green from a previous run. -timeout is the audit's
      # T-3 ask: internal/devnet's poll loops carry wall-clock ceilings, so a
      # slow-but-progressing run can outlive go test's default 10-minute
      # package timeout and die with a goroutine dump — a failure that says
      # nothing about the code. `-timeout` applies to EACH package's test
      # binary, so the number the timeout must clear is the worst single
      # package's ceilings, not the suite's.
      #
      # Re-measured 2026-10-31 (audit F-1): summing every `N*time.Second` and
      # `N*time.Minute` literal in internal/devnet/*_test.go (comments
      # excluded) gives 6,527 s (108 min 47 s) at a13578e; three bare
      # `time.Minute` arguments in stall_test.go and tcp_test.go add 180 s, so
      # the full explicit ceiling is 6,707 s (111 min 47 s), with
      # rotation_out_rt3_test.go alone at 1,800 s. The command for the N*
      # half (it does not count bare literals):
      #
      #   python3 - <<'PY'
      #   import re,glob
      #   print(sum(int(m.group(1))*(60 if m.group(2)=='Minute' else 1)
      #             for f in glob.glob('internal/devnet/*_test.go')
      #             for ln in open(f) for m in
      #             re.finditer(r'(\d+)\s*\*\s*time\.(Second|Minute)',
      #                         ln.split('//')[0])))
      #   PY
      #
      # The audit's 6,357 s does not reproduce under either reading (the
      # `N*time.Second` literals alone sum to 5,927 s); all three numbers are
      # far above 60 m. The previous comment claimed ~3,030 s / ~3,900 s; that
      # was wrong for the second report in a row. 120 m (7,200 s) clears the
      # full 6,707 s with about eight minutes of headroom, for both the plain
      # and the -race binary (same ceilings, slower execution). It is still far
      # above the measured healthy pass, and that pass is HOST-DEPENDENT,
      # because most of internal/devnet's time is real-time consensus waits
      # rather than CPU: on a 12-CPU Apple Silicon host (go1.27.3,
      # GOMAXPROCS=2, load ~3.5 during the run) internal/devnet takes 61 s
      # alone, 69 s in the full suite and 86 s in the full suite under -race.
      # The 16-CPU Windows + Docker host of the 2026-11-06 run measured
      # 104 / 177 / 201 s for the same three. A loaded host multiplies both
      # again (that run's rotation demo went from ~8 s to 65-91 s at load
      # 117), so the timeout is sized for the slowest runner, never for one
      # host's number. A timeout this large is a bound on a pathological run,
      # never an expectation.
      - run: go vet ./...
      - run: go test -timeout 120m -count=1 ./...
      - run: go test -race -timeout 120m -count=1 ./...
      - run: go build ./...
      # Audit F-2: the failure path of a manual run. Only workflow_dispatch can
      # request it, so pushes and PRs are unaffected. A red test job with the
      # `report` job's issue is the end-to-end proof that CI-1's reporter runs;
      # see the comment on the `report` job for the exact command.
      - name: simulate a failure (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.simulate_failure
        run: |
          echo "::error::simulated failure requested by workflow_dispatch input simulate_failure=true (audit F-2); the report job should file an issue"
          exit 1
      # Audit F-4: the two benchmarks that back the "allocates nothing" claims in
      # internal/consensus/diag.go and Chain.IsSeatedAt were never executed by
      # CI. They are opt-in by construction (`go test` skips benchmarks), so the
      # claims rested on prose. This runs BOTH at a fixed 100 iterations; the
      # run is short (a few seconds at most - it is dominated by compilation,
      # and the devnet benchmark brings up four in-process validators), so no
      # measured figure is quoted: the log's allocation line is the evidence,
      # not a wall-clock number. It is a gate on nothing: the benchmark asserts
      # no threshold, so a regression is visible but not red. Turning it into a
      # gate would need an allocation assertion in the benchmark itself; that
      # is deliberately not done here because allocs/op is a measurement, not a
      # correctness property.
      - run: go test -run '^$' -bench 'Benchmark(HotPathObservers|CommitteeMembershipPerFrame)$' -benchmem -benchtime=100x ./internal/devnet ./internal/chain
      # The milestone acceptance commands must keep printing OK with exit 0.
      # The first is the default run — its --claims default makes it pay one
      # claim and prove the same-epoch double claim refused — and the second
      # runs the claim variant explicitly so the faucet path cannot degrade
      # with the flag's default unnoticed. The third is M3's: four validators
      # must AGREE, not merely each produce blocks — the multi-validator
      # devnet reports each validator's final height and fails the job unless
      # the validators hold one history. The fourth is M5's rotation: one seat
      # unbonds mid-epoch, six seats become five at the boundary, and the
      # Nakamoto coefficient is computed from committed state at each one. It
      # was missing here while the README claimed four (M5 re-run, 2026-10-30).
      # It adds about 8 s on a quiet host (measured: 105 blocks, six in-process
      # validators, two rotation boundaries: 8.3-8.4 s wall and 3.0-3.5 s user
      # CPU for the prebuilt binary over three runs, 9.2 s including `go run`'s
      # link, on a 12-CPU Apple Silicon host at load ~3.9). It is bound by the
      # block timers and by host load, not by the work: the 2026-11-06 Docker
      # run measured 65-91 s wall for the same command on 16 CPUs at load 117,
      # against 14 s of user CPU. So 8 s is a range with a condition, not a
      # promise - but on any quiet runner this is seconds, and keeping the
      # milestone check is far cheaper than deleting it from the README to make
      # the count true.
      - run: go run ./cmd/b10coin devnet --blocks 100
      - run: go run ./cmd/b10coin devnet --blocks 100 --claims 1
      - run: go run ./cmd/b10coin devnet --validators 4 --blocks 100
      - run: go run ./cmd/b10coin devnet --validators 6 --epoch-blocks 40 --blocks 105 --rotate-demo --plot-nakamoto
      # M6's acceptance artefact (design decision 1): the walkthrough is an
      # executable proof, not a narrative. The script extracts the one ```sh
      # fence from docs/2026-11-01-m6-walkthrough.md, builds its own binary
      # into a temp dir (never bin/, so it cannot test a stale one), runs the
      # fence against a fresh node on a port below the ephemeral range, and
      # asserts the balances, the transfer preview/receipt and the history
      # window the doc promises. A fence-count failure, a missing promised
      # line, or a command that does not run exits non-zero. It kills its node
      # and removes its temp dir on every path, including timeout and signal.
      # Adds about 4 s to this job (measured 3.5 s wall including the cached
      # build, one Argon2id claim solve and two 1-second block ticks).
      - run: ./scripts/acceptance-walkthrough.sh

  # The supply-chain/lint gate (the audit's B-1): formatting, module hygiene,
  # staticcheck and govulncheck. The two external tools are pinned by exact
  # version and run through `go run tool@version`, which keeps them OUT of
  # go.mod (they are developer tooling, not dependencies of this code) while
  # making the gate reproducible: the finding set is a function of the
  # checked-in version, not of whatever ships that week.
  lint:
    runs-on: ubuntu-latest
    # contents: read is inherited from the top-level default; the ONLY extra grant
    # is issues: write, for the scheduled toolchain-chore step below. No other job
    # gains anything.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # gofmt is enforced on the module's OWN source trees (`cmd`, `internal`),
      # the only directories holding checked-in Go. The README claims the tree
      # is gofmt-clean; this makes the claim a gate.
      - name: gofmt -l reports nothing
        run: |
          unformatted=$(gofmt -l cmd internal)
          test -z "$unformatted" || { echo "not gofmt-clean:"; echo "$unformatted"; exit 1; }
      # shellcheck over every shell script in the tree (audit N-16): the deploy
      # harness, the release/build scripts and the plan guard are operator-facing
      # code that no Go test runs. The gate is `--severity=warning` so it fails
      # on real defects (warnings and errors) without turning pre-existing
      # info/style notes into a red CI; acceptance.sh and check-plan.sh are
      # clean at the default severity too.
      #
      # PINNED (audit S-18). This was the one unpinned tool in an otherwise
      # exactly-pinned gate: it came from the runner image (0.9.0-1 on
      # ubuntu-24.04 when this was written), so a runner-image bump could change
      # the verdict with NO tree change — and the twice-weekly cron's reporter
      # would file that as "ci: scheduled lint job failed", i.e. as a code
      # problem. The version and the digest are pinned here, the tarball is
      # verified before it is unpacked, and the version the binary reports is
      # asserted, so the verdict is a function of this file alone.
      #
      # TO BUMP (the same deliberate act as bumping staticcheck's @vX.Y.Z):
      #   1. pick a release at https://github.com/koalaman/shellcheck/releases;
      #   2. read its SHA-256 from GitHub itself, so the digest does not rest on
      #      this comment being right:
      #        curl -s https://api.github.com/repos/koalaman/shellcheck/releases/tags/vX.Y.Z \
      #          | grep -A3 '"name": "shellcheck-vX.Y.Z.linux.x86_64.tar.gz"' | grep digest
      #      (or compute it: `shasum -a 256 shellcheck-vX.Y.Z.linux.x86_64.tar.gz`)
      #   3. update BOTH variables below, run this step on a branch, and fix or
      #      record any new finding — a bump that reddens the gate is a finding
      #      about this tree, not a reason to unpin.
      # Every pin is checked, none is trusted: `curl -f` fails on a 404, the
      # digest line fails on any other bytes, and the version assertion catches
      # a tarball whose contents do not match its name.
      - name: shellcheck the scripts (pinned)
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.gz"
          tarball="$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION.tar.gz"
          dir="$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION"
          if ! curl -fsSL --proto '=https' --tlsv1.2 -o "$tarball" "$url"; then
            echo "::error::cannot download shellcheck $SHELLCHECK_VERSION from $url. This gate must not pass silently and must not fall back to the runner image's copy: fix the URL or bump the pin."
            exit 1
          fi
          if ! printf '%s  %s\n' "$SHELLCHECK_SHA256" "$tarball" | sha256sum -c -; then
            echo "::error::$tarball does not match the pinned SHA-256. The download is not the artifact this gate was written against: do NOT update the digest to make this pass unless you are deliberately bumping the version."
            exit 1
          fi
          mkdir -p "$dir"
          tar -xzf "$tarball" -C "$dir" --strip-components=1
          "$dir/shellcheck" --version
          got=$("$dir/shellcheck" --version | awk '$1 == "version:" { print $2 }')
          if [ "$got" != "${SHELLCHECK_VERSION#v}" ]; then
            echo "::error::the pinned tarball runs shellcheck $got, not ${SHELLCHECK_VERSION#v}: the pin and the bytes disagree"
            exit 1
          fi
          git ls-files -z '*.sh' | xargs -0 "$dir/shellcheck" --severity=warning
      # THE PLAN GUARD'S PARITY HALF, over every plan (audit S-19). A fence edit
      # can leave one task section unbalanced, which inverts parity for every
      # section after it: the brief extractor then finds empty or bleeding
      # briefs while the plan still looks fine. The guard existed but ran on
      # nobody's machine but its author's, so a broken fence could reach a
      # dispatch. --parity-only is the EXPLICIT opt-out from the guard's other
      # half (task-brief extraction), whose scripts live in the operator's
      # skill directory and are not in this repository; without the flag their
      # absence is a failure, so no machine silently gets the weaker verdict.
      - name: plan fence parity (docs/plans)
        run: |
          set -euo pipefail
          for p in docs/plans/*.md; do
            ./scripts/check-plan.sh --parity-only "$p"
          done
      # `go mod tidy` must be a no-op on a committed tree: a graph tidy wants
      # to change means go.mod/go.sum lie about the build. The diff pins both.
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      # staticcheck 2026.2.1 (module honnef.co/go/tools v0.8.1), the release
      # that matches the toolchain go.mod demands. Findings fail the job: the
      # tree today is clean, so a new finding must be fixed or — with a
      # written reason — excluded, never ignored silently.
      # GOTOOLCHAIN is pinned here on purpose, and NOT to the module's toolchain.
      # Go 1.27.2 raised the compiler's export-data version to 5; staticcheck
      # 2026.2.1 / v0.8.1 is the newest release that exists and its golang.org/x/tools
      # reads up to version 4, so under 1.27.2 it fails with
      #   internal error in importing "internal/byteorder" (... version 5 is greater
      #   than maximum supported version 4)
      # which is an upstream limitation, not a finding about this code. The 2026-10-08
      # net/http advisories are fixed in BOTH 1.26.9 and 1.27.2, so linting under
      # 1.26.9 keeps the vulnerability gate and the lint gate simultaneously. It also
      # matches the module's `go 1.26.0` language floor, which is what staticcheck
      # should judge the source against. Revisit when a staticcheck release reads v5.
      - run: GOTOOLCHAIN=go1.26.9 go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      # govulncheck v1.8.0 (golang.org/x/vuln/cmd/govulncheck) checks
      # call-reachable vulnerabilities against the live vuln DB at
      # https://vuln.go.dev — module-level advisories the code never calls do
      # not fail the gate, which is exactly the signal worth gating on.
      - name: govulncheck
        run: |
          set -o pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... 2>&1 | tee "$RUNNER_TEMP/govulncheck.out"
      # The pinned `toolchain` line (audit B-1) means every Go patch release that
      # fixes a standard-library advisory turns into a red `schedule` run while the
      # code stands still. That is the gate working - but it is a chore nobody sees
      # until they look at Actions, and it has now rotated twice (2026-10-08 ->
      # go1.27.2, then GO-2026-6809 -> go1.27.3). This step files the issue so the
      # chore becomes visible where work is tracked, instead of relying on someone
      # noticing a red cron run.
      #
      # It only ever files on the SCHEDULE trigger: a push or PR that fails
      # govulncheck is a normal failure its author sees immediately, and opening an
      # issue for it would be noise. It is `failure()`-gated and classifies THIS
      # job's failure: govulncheck's output on disk with advisory IDs -> the
      # toolchain-bump or triage issue; anything else (gofmt, shellcheck, tidy,
      # staticcheck, or govulncheck missing) -> a generic `lint` issue. A red cron
      # must never be silent (audit CI-1).
      # The reporter lives in scripts/ci/ so that the shellcheck gate above covers it -
      # ~90 lines of inline YAML shell was logic the rest of this workflow does not have
      # and nothing linted. See that script's header for what it files and why.
      - name: file an issue when a scheduled lint fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/file-toolchain-issue.sh "$RUNNER_TEMP/govulncheck.out"
  # The portability matrix: every supported target is COMPILED and, crucially,
  # go-VETTED for that GOOS/GOARCH. Vet, not build, is what caught the real
  # cross-platform defect of this milestone — a Unix-only syscall in the
  # relay's TEST code that made `GOOS=windows go vet` fail while every build
  # stayed green — so a build-only matrix would have shipped the hole. Each
  # target cross-compiles from one runner; the pair (GOOS, GOARCH) is what
  # the code must survive, not the runner it is compiled on.
  cross:
    runs-on: ${{ matrix.os }}
    name: build + vet (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64 }
          - { os: ubuntu-latest,  goos: linux,   goarch: arm64 }
          - { os: macos-latest,   goos: darwin,  goarch: amd64 }
          - { os: macos-latest,   goos: darwin,  goarch: arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
          - { os: windows-latest, goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  # S-9's discovery half: every fuzz target runs for a bounded time, so a
  # crasher is found here before a stranger finds it on the wire. Scheduled
  # (the twice-weekly cron above) and on-demand (workflow_dispatch) rather
  # than on every push: 9 targets x 60 s is ~10 minutes, worth paying twice a
  # week and when an operator asks, not on every commit.
  #
  # THE BOUND IS `-fuzztime 60s` PER TARGET, not a timeout on the job: each
  # target gets a full minute of mutation from its seeds, and a target that
  # cannot start fails immediately. The job does not run on pushes, so it can
  # never be the reason a PR looks red for a reason unrelated to its diff.
  #
  # A crasher is saved by the Go tool to
  # `testdata/fuzz/<Target>/<hash>` in the target's package and the step goes
  # red. COMMIT THAT FILE: it replays as an ordinary seed on every later run,
  # so the corpus (not the job) is what stops the same input being re-found
  # forever. The file is also the reproduction for the decoder fix - leaving
  # the crasher only in CI's cache would lose it on the next cache eviction,
  # and leaving the recover in without the fix would hide it (audit S-9).
  #
  # The recover in internal/transport/tcp and internal/relay is containment,
  # not a reason to accept a finding: a crasher this job turns up is a bug to
  # fix, and the fuzz run fails on it whether or not a reader would have
  # caught it in production.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: fuzz every target for 60s
        run: |
          set -euo pipefail
          bound=60s
          # One target per line, `<Name> <package>`: -fuzz accepts exactly ONE
          # matching target, so this cannot be one `go test ./...`.
          targets=(
            "FuzzDecodeVote ./internal/consensus"
            "FuzzDecodeProposal ./internal/consensus"
            "FuzzDecodeBlock ./internal/types"
            "FuzzDecodeTx ./internal/types"
            "FuzzReadFrame ./internal/wire"
            "FuzzDecodeHello ./internal/wire"
            "FuzzDecodeBlockSyncReq ./internal/wire"
            "FuzzDecodeBlockSyncResp ./internal/wire"
            "FuzzDecodePeerExchange ./internal/wire"
          )
          for entry in "${targets[@]}"; do
            set -- $entry   # deliberate split: name then package
            echo "::group::go test -run '^$' -fuzz '^$1$' -fuzztime $bound $2"
            go test -run '^$' -fuzz "^$1\$" -fuzztime "$bound" "$2"
            echo "::endgroup::"
          done

  # The release: both binaries for all six targets in dist/ with SHA256SUMS.
  # scripts/build-release.sh owns the build flags AND the artifact assertions
  # (count == target count, every artifact file(1)-checked to report its own
  # architecture, a failing target leaves no partial dist/), so this job
  # simply runs the one build story — replacing the single linux/arm64 job
  # this workflow carried since the Pi task. A regression that silently
  # produced only the host platform's binaries, or dropped one of the pair,
  # fails HERE and not on a Pi flashed hours later.
  #
  # IDENTITY (audit S-10). The artifacts are built with `-buildvcs=auto`, so
  # each one carries `vcs.revision`/`vcs.modified` and prints them in the
  # banner and in `b10coin version`. The steps below assert that the stamp is
  # really there: an anonymous artifact is the failure mode, and it must fail
  # here rather than on three Pis that all call themselves 0.1.0. The stamp
  # comes from the checkout, which is a full git working copy — the `test` job
  # already builds with the same default in the same environment, so this is
  # not a new dependency on the clone's shape.
  #
  # SIGNING (audit S-11). The old comment here told the reader to "add a
  # repository secret ... write it to a runner temp file in a step here" and
  # there was no such step and no `secrets.` reference anywhere in this file:
  # the signing boundary was documented, never wired. It is wired now, and the
  # key material is treated as the attack surface it is:
  #   - the secret reaches the shell ONLY as an environment variable, never as
  #     an interpolated `${{ secrets... }}` inside the script text (where a
  #     secret containing a quote or a backtick would be parsed as code);
  #   - it is written with `umask 077` into a 0700 mktemp directory under
  #     $RUNNER_TEMP — OUTSIDE the workspace, so it cannot be picked up by a
  #     build, a checksum, BUILD-INFO or the artifact upload — and the file's
  #     0600 mode is asserted, not assumed;
  #   - there is no `set -x` in this step and the secret is never an operand of
  #     echo, so the log sees a PATH, never the material;
  #   - an EXIT/INT/TERM trap removes the directory on every path, including
  #     the failure path, so a red run does not leave a key on the runner;
  #   - a signature that does not appear is a FAILURE. build-release.sh refuses
  #     to finish an unsigned release when a key is set; the explicit check
  #     here says so in the workflow's own words, and the signature is then
  #     VERIFIED against the public key derived from the same secret, because a
  #     .minisig that does not verify is worse than none at all.
  #
  # PUBLISH GATE (audit S-11). The artifact upload is TAG-ONLY. Before this, an
  # unsigned dist/ from any branch or Dependabot bump was published under the
  # name "b10coin-release", indistinguishable from the maintainer's. The build
  # and its assertions still run on every push — that is the regression gate —
  # but only a tag publishes, and the artifact name carries the tag AND the
  # signing state, so an operator sees `...-signed` or `...-UNSIGNED` and never
  # has to guess which build they are holding.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build, sign and verify the release
        id: release
        env:
          # An absent repository secret is an empty string, which is the
          # unsigned path. Nothing about the key is interpolated into the
          # script below; it travels as an environment variable.
          SIGN_KEY_SECRET: ${{ secrets.B10COIN_RELEASE_SIGN_KEY }}
        run: |
          set -euo pipefail
          # Outside $GITHUB_WORKSPACE on purpose: nothing here can be read by
          # the build, swept into dist/, or uploaded.
          keydir=$(mktemp -d "$RUNNER_TEMP/b10coin-signing.XXXXXX")
          chmod 700 "$keydir"
          trap 'rm -rf "$keydir"' EXIT INT TERM
          signing=UNSIGNED
          if [ -n "${SIGN_KEY_SECRET:-}" ]; then
            keyfile="$keydir/b10coin.key"
            # umask BEFORE the redirection, so the file is 0600 from creation.
            ( umask 077; printf '%s' "$SIGN_KEY_SECRET" > "$keyfile" )
            perm=$(stat -c '%a' "$keyfile")
            if [ "$perm" != "600" ]; then
              echo "::error::$keyfile is mode $perm, not 600. Refusing to use a signing key other local users can read."
              exit 1
            fi
            # minisign is NOT on the ubuntu-latest image, so a wired secret
            # alone would reproduce the S-11 defect one layer down: a signing
            # path that cannot run. It is pinned by version AND digest, the
            # same discipline as shellcheck (audit S-18); GitHub records no
            # digest for this project's assets, so the value below was computed
            # from the release asset itself and a wrong value fails CLOSED at
            # the checksum line. Re-derive it before bumping:
            #   curl -fsSL -O https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
            #   sha256sum minisign-0.12-linux.tar.gz
            minisign_version=0.12
            minisign_sha256=9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
            minisign_tar="$keydir/minisign.tar.gz"
            minisign_url="https://github.com/jedisct1/minisign/releases/download/$minisign_version/minisign-$minisign_version-linux.tar.gz"
            if ! curl -fsSL --proto '=https' --tlsv1.2 -o "$minisign_tar" "$minisign_url"; then
              echo "::error::cannot download minisign $minisign_version from $minisign_url, so the supplied signing key cannot be used"
              exit 1
            fi
            if ! printf '%s  %s\n' "$minisign_sha256" "$minisign_tar" | sha256sum -c -; then
              echo "::error::$minisign_tar does not match the pinned SHA-256; refusing to run it"
              exit 1
            fi
            tar -xzf "$minisign_tar" -C "$keydir"
            export PATH="$keydir/minisign-linux/x86_64:$PATH"
            # A passphrase-protected key would block on a prompt with no TTY
            # here; `timeout` turns that from a hung job into a named failure.
            # Deriving the public key first also proves the secret is a usable
            # minisign key before anything is built or signed.
            if ! timeout 30 minisign -R -s "$keyfile" -p "$keydir/verify.pub" >/dev/null; then
              echo "::error::minisign cannot use the supplied key. A passphrase-protected key cannot work in CI (there is no TTY to prompt on): store an UNENCRYPTED minisign key in B10COIN_RELEASE_SIGN_KEY, or sign a release locally."
              exit 1
            fi
            export B10COIN_RELEASE_SIGN_KEY="$keyfile"
            signing=signed
            echo "release signing: a key was supplied from the repository secret; SHA256SUMS will be signed"
          else
            echo "::warning::no B10COIN_RELEASE_SIGN_KEY secret is configured: this release's SHA256SUMS will be UNSIGNED and will say so"
          fi
          make release
          if [ -n "${SIGN_KEY_SECRET:-}" ]; then
            if [ ! -s dist/SHA256SUMS.minisig ]; then
              echo "::error::a signing key was supplied but dist/SHA256SUMS.minisig is missing or empty. An unsigned release must never be published as if it were signed."
              exit 1
            fi
            minisign -Vm dist/SHA256SUMS -p "$keydir/verify.pub"
            echo "release signing: SHA256SUMS.minisig verified against the public key derived from the same secret"
          fi
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
      - run: file dist/*
      # Belt over the script's internal assertion: exactly 12 b10coin-*
      # artifacts for 6 targets (BUILD-INFO is metadata, not a binary), and
      # every artifact line present in SHA256SUMS.
      - run: test "$(ls dist/b10coin-* | wc -l)" -eq 12
      - run: test "$(wc -l < dist/SHA256SUMS)" -eq 12
      # The toolchain record must exist and be non-empty (audit B-2).
      - run: grep -q '^toolchain go' dist/BUILD-INFO
      # The flags line must be the flags the build was given — BUILD-INFO
      # records the same variable the build line used, and this is where the
      # two are compared (audit S-10 dropped -buildvcs=false; if that changes
      # again, this is the line that should go red).
      - run: grep -q '^flags -trimpath -buildvcs=auto$' dist/BUILD-INFO
      # The build identity must be RECORDED, and recorded from the artifacts
      # themselves (build-release.sh reads it back with `go version -m`). A
      # release whose BUILD-INFO cannot name its commit is the S-10 failure.
      - run: grep -Eq '^vcs\.revision [0-9a-f]{40,64}$' dist/BUILD-INFO
      - run: grep -Eq '^vcs\.modified (true|false)$' dist/BUILD-INFO
      # Publish the artifacts (audit B-2). Pinned by commit SHA, like every
      # other action here; the comment names the tag it matches.
      #
      # TAG-ONLY (audit S-11): see the job comment above. `if-no-files-found`
      # stays an error, and the name carries the tag and the signing state so
      # a downloaded artifact is self-describing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: b10coin-release-${{ github.ref_name }}-${{ steps.release.outputs.signing }}
          path: dist/
          if-no-files-found: error

  # CI-1's durable fix, not just its instance: a scheduled run that fails ANY
  # job is reported, not only one that fails govulncheck. `main` failed its
  # scheduled release on every run from 2026-10-27 and nobody was told, because
  # the only reporter lived in `lint` and watched one step.
  #
  # This job exists instead of appending a reporter step to each job for two
  # reasons. First, the token scope: only `lint` had `issues: write`, and that
  # stays true - `test`, `release` and `cross` remain read-only. Second, `lint`
  # reports itself in-job, where govulncheck's output file still exists; a
  # separate job cannot read another job's $RUNNER_TEMP, so the toolchain-bump
  # body (with "Fixed in:" and the four verify commands) would be lost. The two
  # paths never overlap: `lint` is not in the loop below.
  #
  # `always()` so a failure upstream still reaches it; the event gate keeps it
  # off pushes and PRs, where the author already sees the failure. The script
  # dedups by exact title and exits 0 on every path, including a failed gh call.
  report:
    # Schedule is the normal path. A manual run with simulate_failure=true is
    # the F-2 rehearsal: the `test` job fails on purpose, this job runs, and the
    # issue-filing script below is exercised end to end. `gh workflow run
    # ci.yml -f simulate_failure=true` is the whole procedure; delete the test
    # issue it files.
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.simulate_failure))
    needs: [test, lint, release, cross, fuzz]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: file an issue for every failed scheduled job
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          CROSS_RESULT: ${{ needs.cross.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          set -u
          # `lint` reports itself in-job (its govulncheck output is there); the
          # other jobs have no vuln output to classify, so each gets a generic
          # "scheduled <job> job failed" issue. Matrix legs of `cross` share one
          # title on purpose: one broken platform should not open six issues,
          # and later legs comment on the first one. `fuzz` is the S-9 crasher
          # job: a scheduled fuzz failure is a decoder bug that must not go
          # unseen, so it is in this loop for exactly the CI-1 reason.
          for job in test release cross fuzz; do
            case "$job" in
              test)    result=$TEST_RESULT ;;
              release) result=$RELEASE_RESULT ;;
              cross)   result=$CROSS_RESULT ;;
              fuzz)    result=$FUZZ_RESULT ;;
            esac
            if [ "$result" = failure ]; then
              REPORT_JOB=$job ./scripts/ci/file-toolchain-issue.sh \
                || echo "::warning::the scheduled-failure reporter failed for the $job job"
            fi
          done